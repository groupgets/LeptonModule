name: Bug report
description: Something in this repository fails or behaves wrongly.
body:
  - type: markdown
    attributes:
      value: |
        This repository covers the Raspberry Pi examples and hardware files for the Lepton Breakout Board. GroupGets provides this code as is and does not offer support, but clear reports help everyone who uses it.

        Before filing, please check the [README](https://github.com/groupgets/LeptonModule#readme) and search existing issues, open and closed.
  - type: dropdown
    id: board
    attributes:
      label: "Board"
      options:
        - "Breakout Board v2"
        - "Breakout Board v1"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: lepton
    attributes:
      label: "Lepton model"
      description: "Printed on the label on the back of the Lepton module."
      options:
        - "Lepton 3.5"
        - "Lepton 3.1R"
        - "Lepton 3.0"
        - "Lepton 2.5"
        - "Lepton 2.0"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: "Raspberry Pi model"
      options:
        - "Raspberry Pi 5"
        - "Raspberry Pi 4"
        - "Raspberry Pi 3"
        - "Raspberry Pi Zero 2 W"
        - "Other"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: "Operating system and version"
      description: "Run `cat /etc/os-release` and paste the PRETTY_NAME line, for example `Debian GNU/Linux 12 (bookworm)`."
    validations:
      required: true
  - type: input
    id: spi_device
    attributes:
      label: "SPI device used"
      description: "The device path your code opens, for example `/dev/spidev0.0` or `/dev/spidev0.1`."
      placeholder: "/dev/spidev0.0"
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: "Which part of this repository?"
      options:
        - "raspberrypi_video"
        - "raspberrypi_capture"
        - "v4l2lepton"
        - "raspberrypi_qt"
        - "flirpi"
        - "Hardware files"
        - "Legacy example (BeagleBone, Edison, STM32, Arduino, ThermalView)"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "What happened?"
      description: "What you did, what you expected, and what happened instead."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "The exact commands or actions, in order, starting from a fresh setup if you can."
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: "Full output or error"
      description: "Paste the complete terminal output or error message. It is formatted as code automatically."
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues, open and closed, for this problem.
          required: true
        - label: SPI and I2C are enabled in `raspi-config`, and I checked the wiring against the README.
          required: false
